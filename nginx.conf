server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik termine le TLS : on ne réécrit pas les redirections en http://host:80
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml application/rss+xml image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Fichiers fingerprintés par Hugo et médias : cache long
    location ~* \.(css|js|woff2?|ttf|png|jpe?g|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
